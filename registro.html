<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | DecoHogar</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body
    class="d-flex flex-column min-vh-100 bg-light"
    style="background-image: url(&quot;assets/fondo.png&quot;); background-repeat: repeat">
    <header class="navbar-header bg-success border-bottom py-2 px-4 shadow-sm">
      <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid px-0">
          <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img src="assets/favicon.png" alt="Logo" width="40" height="40" />
            <span class="fw-bold text-white">Tienda DecoHogar</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Menú de navegación">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link text-white" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="login.html">Iniciar Sesión</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active fw-bold text-white" href="registro.html">Registro</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-auto py-5 d-flex justify-content-center align-items-center">
      <div class="card border shadow-sm w-100" style="max-width: 550px">
        <div class="card-header text-center bg-success border-bottom py-3">
          <h2 class="h5 mb-0 fw-bold text-white">Formulario de Registro</h2>
        </div>
        <div class="card-body p-4 text-center">
          <form action="registro.html" method="post" class="mb-4">
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="inputNombre"
                name="nombre"
                placeholder="Nombre completo"
                required />
            </div>
            <div class="mb-3">
              <input
                type="email"
                class="form-control"
                id="emailInput"
                name="email"
                placeholder="Correo Electrónico"
                required />
            </div>
            <div class="mb-3">
              <input
                type="password"
                class="form-control"
                id="passwordInput"
                name="password"
                placeholder="Contraseña"
                required />
            </div>
            <div class="mb-3">
              <input
                type="password"
                class="form-control"
                id="confirmPasswordInput"
                name="confirm_password"
                placeholder="Confirmar Contraseña"
                required />
            </div>
            <h3 class="h6 mb-3 fw-semibold text-start text-success">
              Estilo de decoración preferido:
            </h3>
            <fieldset class="form-group mb-3" style="flex-direction: row; display: flex; gap: 10px">
              <div>
                <input type="checkbox" id="minimalista" name="minimalista" />
                <label for="minimalista">Minimalista</label>
              </div>
              <div>
                <input type="checkbox" id="industrial" name="industrial" />
                <label for="industrial">Industrial</label>
              </div>
              <div>
                <input type="checkbox" id="nordico" name="nordico" />
                <label for="nordico">Nórdico</label>
              </div>
              <div>
                <input type="checkbox" id="vintage" name="vintage" />
                <label for="vintage">Vintage</label>
              </div>
              <div>
                <input type="checkbox" id="rustico" name="rustico" />
                <label for="rustico">Rústico</label>
              </div>
              <div>
                <input type="checkbox" id="moderno" name="moderno" />
                <label for="moderno">Moderno</label>
              </div>
            </fieldset>
            <p class="text-muted small">* Puede escoger múltiples estilos según prefiera.</p>

            <h3 class="h6 mb-3 fw-semibold text-start text-success">Direcciones de envío</h3>
            <div id="direcciones"></div>
            <button type="button" class="btn btn-outline-success btn-sm mb-3" id="btn-agregar">
              Agregar dirección
            </button>

            <button type="submit" class="btn btn-success w-100">Registrarse</button>
          </form>
        </div>
      </div>
    </main>

    <footer
      class="border-top py-3 text-center text-muted small mt-auto"
      style="background-color: #4edf9b">
      <div class="container text-white">
        <p class="mb-0">© 2026 Tienda DecoHogar - Todos los derechos reservados.</p>
      </div>
    </footer>
    <script src="js/registro.js"></script>
  </body>
</html>
