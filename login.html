<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | DecoHogar</title>
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js" defer></script>
  </head>
  <body
    class="d-flex flex-column min-vh-100 bg-light"
    style="background-image: url(&quot;assets/fondo.png&quot;); background-repeat: repeat">
    <header class="navbar-header bg-success border-bottom py-2 px-4 shadow-sm">
      <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid px-0">
          <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
            <img src="assets/favicon.png" alt="Logo" width="40" height="40" />
            <span class="fw-bold text-white">Tienda DecoHogar</span>
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Menú de navegación">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link text-white" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active fw-bold text-white" href="login.html">Iniciar Sesión</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="registro.html">Registro</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-auto py-5 d-flex justify-content-center align-items-center">
      <div class="card border shadow-sm w-100" style="max-width: 550px">
        <div class="card-header text-center bg-success border-bottom py-3">
          <h2 class="h5 mb-0 fw-bold text-white">Iniciar sesión en DecoHogar</h2>
        </div>
        <div class="card-body p-4 text-center">
          <form id="login" class="mb-4">
            <div class="mb-3">
              <input
                type="email"
                class="form-control"
                name="email"
                placeholder="Correo Electrónico"
                required />
            </div>
            <div class="mb-3">
              <input
                type="password"
                class="form-control"
                name="password"
                placeholder="Contraseña"
                required />
            </div>
            <p class="text-muted small mb-3">
              ¿No tienes una cuenta?
              <a href="registro.html" class="text-success fw-bold">Regístrate aquí</a>
            </p>
            <div
              id="mensaje-error"
              class="alert alert-danger d-none text-start small mb-3"
              role="alert"></div>
            <button type="submit" class="btn btn-outline-success w-100">Acceder</button>
          </form>
        </div>
      </div>
    </main>

    <footer
      class="border-top py-3 text-center text-muted small mt-auto"
      style="background-color: #4edf9b">
      <div class="container text-white">
        <p class="mb-0">© 2026 Tienda DecoHogar - Todos los derechos reservados.</p>
      </div>
    </footer>
  </body>
</html>
